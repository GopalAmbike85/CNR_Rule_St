# ─── SonarQube Cloud Project Configuration ──────────────────────────────────
# Version: v3
# Project: CNR-Motor-Driver-1.0 (STM32G431, STM32CubeIDE + CMake/Ninja build)
# Date: 02-08-2026
#
# UPDATE FROM v2: sonar.cfamily.compile-commands removed from this file.
# It is now passed via --define in cnr_Sonar_Setup.yml (v4), which uses
# the official SonarSource/sonarqube-scan-action. Keeping it in both
# places risked the two falling out of sync with conflicting values.
#
# sonar.organization is REQUIRED for SonarQube Cloud (confirmed from your
# account screenshot: org "GopalAmbike85", key "gopalambike85", Free plan).

# Organisation and project identity
sonar.organization=gopalambike85
sonar.projectKey=cnr-motor-driver
sonar.projectName=CNR-Motor-Driver-1.0
sonar.projectVersion=1.0

# Source code location - adjust if your actual source folder differs
# (STM32CubeIDE default is Src/ and Inc/, confirm against your repo layout)
sonar.sources=Src
sonar.inclusions=**/*.c,**/*.h

# Language
sonar.language=c
sonar.c.file.suffixes=.c
sonar.h.file.suffixes=.h

# Encoding
sonar.sourceEncoding=UTF-8

# Exclude build output, vendor/third-party code, and toolchain folders
sonar.exclusions=**/build/**,**/MCSDK_v6.4.2-Full/**,**/Drivers/CMSIS/**,**/arm-gnu-toolchain-**/**

# Build Wrapper output (CFamily plugin) - path is now passed via the
# workflow's --define argument, not set here. See cnr_Sonar_Setup.yml (v4).

# Quality gate - do not fail the CI build if quality gate fails (change to
# true once you're ready to enforce it)
sonar.qualitygate.wait=false

# Coverage report path (only relevant once you add unit tests + coverage)
# sonar.coverageReportPaths=unit_tests/build/coverage-sonarqube.xml
