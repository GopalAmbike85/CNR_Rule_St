# ─── cnr_Sonar_Setup.yml (v2) ───────────────────────────────────────────────
# Purpose : Build CNR-Motor-Driver-1.0 (STM32G431, CMake/Ninja) and run
#           SonarQube (self-hosted) static analysis.
# Date    : 02-08-2026
#
# CHANGES FROM v1 (fixing CI job 91508895307 failure):
#   1. Fixed build-wrapper extracted folder name: it is
#      "build-wrapper-linux-x86-64", not "build-wrapper-linux-x86" as v1
#      had it. This caused a later "command not found" for the wrapper.
#   2. Added an explicit secrets-check step so a missing SONAR_HOST_URL or
#      SONAR_TOKEN fails immediately with a clear message, instead of curl
#      failing cryptically with "URL rejected: No host part in the URL".
#   3. Skip the Sonar download/scan steps on pull requests from forked
#      repos, since GitHub does not expose secrets to those workflow runs.
#   4. Used curl -fLs (fail on HTTP errors, follow redirects, silent) so
#      download failures surface clearly instead of silently saving an
#      error page as the zip file.
#
# ASSUMPTIONS (please confirm, not verified against your actual repo):
#   1. Project subfolder inside the repo is "CNR-Motor-Driver-1.0"
#      (based on your local path D:\CNR\GithubGA\CNR_Rule_St\CNR-Motor-Driver-1.0)
#   2. CMake preset name is "Debug" (matches CMakePresets.json you shared)
#   3. Toolchain file cmake/gcc-arm-none-eabi.cmake exists inside the project
#      folder and correctly points to an ARM GCC toolchain.
#   4. C/C++ (CFamily) analysis needs SonarQube Developer Edition or higher.
#      Until that license is active, this workflow will still run the build
#      and scanner, but Sonar will skip CFamily-specific rules.
#
# REQUIRED GitHub secrets (Settings > Secrets and variables > Actions):
#   SONAR_HOST_URL  -> e.g. https://sonarqube.yourcompany.com
#   SONAR_TOKEN     -> a SonarQube user/project token with "Execute Analysis" permission
#
# Place this file at: .github/workflows/cnr_Sonar_Setup.yml

name: CNR Motor Driver - SonarQube Analysis

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'CNR-Motor-Driver-1.0/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'CNR-Motor-Driver-1.0/**'
  workflow_dispatch: {}   # allows manual trigger from the Actions tab

env:
  PROJECT_DIR: CNR-Motor-Driver-1.0
  BUILD_WRAPPER_OUT_DIR: build-wrapper-output

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history improves SonarQube blame/new-code analysis
          submodules: recursive  # remove this line if MCSDK/Drivers are not submodules

      - name: Install build tools (CMake, Ninja, ARM GCC toolchain)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi

      - name: Verify ARM toolchain
        run: arm-none-eabi-gcc --version

      - name: Check Sonar secrets are set
        run: |
          if [ -z "${{ secrets.SONAR_HOST_URL }}" ] || [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "ERROR: SONAR_HOST_URL or SONAR_TOKEN secret is not set."
            echo "Add both under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Download SonarQube Build Wrapper
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          curl -fLs -o build-wrapper-linux-x86.zip \
            "${{ secrets.SONAR_HOST_URL }}/static/cpp/build-wrapper-linux-x86.zip"
          unzip -q build-wrapper-linux-x86.zip
          # NOTE: the zip extracts to "build-wrapper-linux-x86-64", not
          # "build-wrapper-linux-x86" (v1 bug, fixed here).
          echo "$GITHUB_WORKSPACE/build-wrapper-linux-x86-64" >> "$GITHUB_PATH"

      - name: Download SonarScanner CLI
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          curl -fLs -o sonar-scanner.zip \
            "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip"
          unzip -q sonar-scanner.zip
          echo "$GITHUB_WORKSPACE/sonar-scanner-6.2.1.4610-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Configure CMake (Debug preset)
        working-directory: ${{ env.PROJECT_DIR }}
        run: cmake --preset Debug

      - name: Build wrapped with Sonar build-wrapper
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          build-wrapper-linux-x86-64 \
            --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} \
            cmake --build --preset Debug

      - name: Run SonarQube scan
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"

      # Optional: fail the pipeline if quality gate fails, once you're ready
      # to enforce it. Requires sonar.qualitygate.wait=true in
      # sonar-project.properties, and the SonarQube webhook configured to
      # notify GitHub Actions.
      # - name: SonarQube Quality Gate check
      #   uses: sonarsource/sonarqube-quality-gate-action@master
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
