# ─── cnr_Sonar_Setup.yml (v14) ──────────────────────────────────────────────
# Purpose : Build CNR-Motor-Driver-1.0 (STM32G431, CMake/Ninja) and run
#           SonarQube Cloud static analysis.
# Date    : 19-08-2026
#
# CHANGE FROM v13: clang-tidy-sonar.json (and the raw clang-tidy-output.txt
# it's built from) was never persisted anywhere - it only existed
# transiently on the runner during the job, then vanished. Added an
# upload-artifact step for both files, plus a `cat` of the JSON to the log
# itself, so the actual content passed to sonar.externalIssuesReportPaths
# can be inspected directly, not just inferred from the "Converted N
# issue(s)" summary line.
#
# CHANGE FROM v12: run #30 succeeded with the fixed compilation database,
# but reported "Converted 0 issue(s), 0 distinct rule(s)." Verified via the
# SonarQube Cloud dashboard (Coverage 88.9% on motor_telemetry_math.c
# confirms the pipeline itself works) that this wasn't an import failure -
# but with no .clang-tidy config or -checks flag, clang-tidy's bare
# defaults are minimal enough that "0 issues" could also just mean "barely
# checked anything." Added an explicit -checks= allowlist so this
# actually runs the bug-finding categories that motivated adding
# clang-tidy in the first place. See the "Run clang-tidy" step below.
#
# CHANGE FROM v11: run #25 (first to get past the apt-mirror fix) reached
# the clang-tidy step and failed with "No compilation database found ...
# or any parent directory" for motor_telemetry_math.c. Root cause: that
# file is host-only (see unit_tests/CMakeLists.txt) and is never compiled
# by the ARM firmware build build-wrapper wraps, so it can never appear in
# build-wrapper-output/compile_commands.json. Repointed clang-tidy's -p at
# unit_tests/build instead (the host build a few steps above, which
# actually compiles this file) and added CMAKE_EXPORT_COMPILE_COMMANDS ON
# to unit_tests/CMakeLists.txt so that directory has a compile database to
# find. See the "Run clang-tidy" step below for the full reasoning.
#
# CHANGE FROM v10: runs #22-24 all spent minutes stuck retrying GitHub's
# runner mirror during "Install build tools" (one run got cancelled while
# still on this step). Confirmed from the actual log - "Get:1
# file:/etc/apt/apt-mirrors.txt Mirrorlist" - the runner's apt tries
# azure.archive.ubuntu.com first via that exact file, retries it several
# times, then falls back to the public archive.ubuntu.com (which works).
# Rewrote /etc/apt/apt-mirrors.txt to skip straight to the public archive,
# plus added Acquire::Retries/Timeout flags and DEBIAN_FRONTEND=noninteractive
# as defense-in-depth. See the "Install build tools" step below.
#
# CHANGE FROM v9: v9's first real CI run (#22) failed with the exact same
# "doubled path" shape as the v6 coverage bug:
#   NoSuchFileException: .../CNR-Motor-Driver-1.0/CNR-Motor-Driver-1.0/
#   clang-tidy-sonar.json
# v9 had guessed sonar.externalIssuesReportPaths follows compile-commands'
# convention (repo-root-relative, needs PROJECT_DIR prefix) - wrong. It
# actually follows coverageReportPaths' convention (relative to
# projectBaseDir, already PROJECT_DIR). Prefix removed - see the
# "SonarQube Scan" step's args below.
#
# CHANGE FROM v8: added clang-tidy, run only against motor_telemetry_math.c
# (the one file this project fully owns - see codeRules/CodeQualityRules.md
# Scope table). It covers checks code_quality_checker.py deliberately does
# NOT attempt via plain regex (const-correctness, narrowing conversions,
# unused return values - those need real type/data-flow analysis). Findings
# are converted to SonarQube's Generic Issue Import Format via
# codeRules/tools/convert_clang_tidy_to_sonar.py (self-tested against a
# synthetic sample, schema cross-checked against two independently-fetched
# Sonar doc pages) and surfaced via sonar.externalIssuesReportPaths.
#
# CHANGE FROM v7: exclude vendor/CubeMX-generated files from the coverage
# requirement via sonar.coverage.exclusions. Without this, the Quality
# Gate's "Coverage on New Code" condition counts ST's Motor Control SDK
# (47 of 58 files) and CubeMX-generated glue against the coverage bar, even
# though codeRules/CodeQualityRules.md (Rule 0) already puts that code out
# of scope for this project's own conventions - it's not code we're
# supposed to unit-test or even hand-edit. Only motor_telemetry_math.c/h
# are fully custom and expected to carry real coverage. The exclusion list
# is computed dynamically in a new step below (same "everything except the
# known custom files" logic, not a hardcoded list) so it can't silently go
# stale the way a hand-maintained list would.
#
# CHANGE FROM v6: v6 added the PROJECT_DIR prefix to sonar.coverageReportPaths
# by analogy with compile-commands, but that was wrong - CI failed with:
#   Error during parsing of the generic coverage report
#   '.../CNR-Motor-Driver-1.0/CNR-Motor-Driver-1.0/unit_tests/build/coverage/coverage-sonarqube.xml'
# (note the doubled "CNR-Motor-Driver-1.0"). Unlike compile-commands,
# coverageReportPaths resolves relative to projectBaseDir (already
# PROJECT_DIR), so the extra prefix duplicated it. Removed the prefix for
# this property only - see the "SonarQube Scan" step's args below.
#
# CHANGE FROM v5: wired up sonar.coverageReportPaths. Previously this job
# never generated or passed any coverage data to the scanner, so SonarQube
# Cloud always reported 0% coverage on new code (the separate
# "SonarCloud Code Analysis" check's Quality Gate failure) - not because
# coverage was actually zero, but because it was never measured here. The
# host-build unit tests + gcovr steps already existed in the OTHER workflow
# (cnr_review_test_coverage.yml's unit-tests-coverage job), but that job
# runs on a separate runner with no shared filesystem, so its output never
# reached this job. Duplicated the same steps here instead of trying to
# share artifacts across two independent workflow files (cross-workflow
# artifact sharing requires the GitHub REST API and correlating run IDs -
# far more fragile than just re-running the same cheap host-build steps).
#
# CHANGE FROM v4: fixed sonar.cfamily.compile-commands path. CI run on PR #1
# (PoC -> main) failed with:
#   java.nio.file.NoSuchFileException:
#   /home/runner/work/CNR_Rule_St/CNR_Rule_St/build-wrapper-output/compile_commands.json
# The scanner resolves sonar.cfamily.compile-commands relative to its own
# working directory (repo root), not relative to projectBaseDir - so the
# PROJECT_DIR prefix was missing. See the "SonarQube Scan" step below.
# Same repo-root-relative resolution applies to sonar.coverageReportPaths
# below, so it also gets the PROJECT_DIR prefix.
#
# MAJOR CHANGE FROM v3: replaced the manual "curl the build-wrapper zip"
# steps with SonarSource's OFFICIAL GitHub Actions:
#   - SonarSource/sonarqube-scan-action/install-build-wrapper@v8.2.0
#   - SonarSource/sonarqube-scan-action@v8.2.0
# This is the cause of the "command not found: build-wrapper-linux-x86-64"
# failure in v3: manually curling the zip from SonarQube Cloud is known to
# be fragile (confirmed via Sonar's own community forum, cases of
# "not a zip file" errors on that same download URL). The official actions
# handle this download/extraction correctly and are actively maintained by
# SonarSource, source: https://github.com/SonarSource/sonarqube-scan-action
# Version v8.2.0 confirmed as latest on GitHub Marketplace as of this date.
#
# REQUIRED GitHub secret (Settings > Secrets and variables > Actions):
#   SONAR_TOKEN -> token generated from SonarQube Cloud > My Account > Security
#   (SONAR_HOST_URL is NOT needed for SonarQube Cloud, only for self-hosted
#   SonarQube Server - confirmed from the official action's own docs)
#
# ASSUMPTIONS (please confirm against your actual repo):
#   1. Project subfolder inside the repo is "CNR-Motor-Driver-1.0"
#   2. CMake preset name is "Debug"
#   3. sonar-project.properties (in CNR-Motor-Driver-1.0/) has
#      sonar.organization=gopalambike85 and sonar.projectKey=cnr-motor-driver

name: CNR Motor Driver - SonarQube Analysis

on:
  push:
    branches: [ main, Development ]
    paths:
      - 'CNR-Motor-Driver-1.0/**'
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main, Development ]
    paths:
      - 'CNR-Motor-Driver-1.0/**'
  workflow_dispatch: {}

env:
  PROJECT_DIR: CNR-Motor-Driver-1.0
  BUILD_WRAPPER_OUT_DIR: build-wrapper-output   # relative to PROJECT_DIR, not repo root
  COVERAGE_REPORT: unit_tests/build/coverage/coverage-sonarqube.xml   # relative to PROJECT_DIR, not repo root
  CLANG_TIDY_REPORT: clang-tidy-sonar.json   # relative to PROJECT_DIR, not repo root

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history improves SonarQube's new-code analysis
          submodules: recursive  # remove this line if MCSDK/Drivers are not submodules

      # Added v11: runs #22-24 all spent several minutes (one got cancelled
      # while still on this exact step) stuck retrying GitHub's own runner
      # mirror. Confirmed from the actual log line "Get:1
      # file:/etc/apt/apt-mirrors.txt Mirrorlist" - the runner's apt is
      # configured to try azure.archive.ubuntu.com FIRST via that mirrorlist
      # file, and repeatedly re-negotiates with it (several "Ign:" retries)
      # before falling back to the public archive.ubuntu.com, which does
      # work. This rewrites that exact mirrorlist file to skip the flaky
      # regional mirror entirely and go straight to the known-good public
      # archive, instead of just tolerating the slow fallback. The
      # Acquire::Retries/Timeout flags are a second line of defense in case
      # a different mirror misbehaves in the future.
      - name: Install build tools (CMake, Ninja, ARM GCC toolchain, clang-tidy)
        run: |
          echo "http://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            -o Acquire::Retries=3 \
            cmake ninja-build gcc-arm-none-eabi clang-tidy

      - name: Verify ARM toolchain
        run: arm-none-eabi-gcc --version

      # ─── Host-build unit tests + coverage, so the scan below has real
      # coverage data instead of reporting 0% for lack of any. Mirrors the
      # same steps as cnr_review_test_coverage.yml's unit-tests-coverage
      # job (see that file for the filter-regex rationale) - duplicated
      # here since that job runs in a separate workflow/runner and its
      # output can't be reached from this one.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install gcovr
        run: pip install gcovr==8.6

      - name: Configure unit tests (host build, fetches Unity)
        working-directory: ${{ env.PROJECT_DIR }}
        run: cmake -S unit_tests -B unit_tests/build -G Ninja

      - name: Build unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: cmake --build unit_tests/build

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: ctest --test-dir unit_tests/build --output-on-failure

      - name: Generate coverage report (for SonarQube)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p unit_tests/build/coverage
          gcovr --root . unit_tests/build \
            --filter '(.*/)?motor_telemetry_math\.(c|h)$' \
            --sonarqube ${{ env.COVERAGE_REPORT }} \
            --print-summary

      # Compute which files should count toward the coverage requirement:
      # only the files this project fully owns (currently just
      # motor_telemetry_math.c/h). Everything else under Src/ and Inc/ is
      # either ST's Motor Control SDK vendor code or CubeMX-generated glue,
      # already documented as out of this project's testing scope in
      # codeRules/CodeQualityRules.md's Scope section. Computed here
      # instead of hardcoded, so a new custom module added later doesn't
      # silently stay excluded - update CUSTOM_FILES below when that
      # happens (same caveat as CodeQualityRules.md's own vendor grep:
      # "do not hardcode this list as permanent").
      - name: Compute coverage exclusions (vendor + CubeMX-generated files)
        id: covexcl
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          CUSTOM_FILES="motor_telemetry_math.c motor_telemetry_math.h"

          EXCLUSIONS=""
          for f in $(find Src Inc -maxdepth 1 -type f \( -name '*.c' -o -name '*.h' \) | sort); do
            base="$(basename "$f")"
            is_custom=false
            for c in $CUSTOM_FILES; do
              [ "$base" = "$c" ] && is_custom=true
            done
            if [ "$is_custom" = false ]; then
              EXCLUSIONS="${EXCLUSIONS}**/${base},"
            fi
          done
          EXCLUSIONS="${EXCLUSIONS%,}"   # strip trailing comma

          echo "exclusions=$EXCLUSIONS" >> "$GITHUB_OUTPUT"
          echo "Coverage requirement applies only to: $CUSTOM_FILES"
          echo "Excluded from coverage requirement ($(echo "$EXCLUSIONS" | tr ',' '\n' | wc -l) files):"
          echo "$EXCLUSIONS" | tr ',' '\n'

      - name: Check SONAR_TOKEN is set
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "ERROR: SONAR_TOKEN secret is not set."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install SonarQube Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v8.2.0

      - name: Configure CMake (Debug preset)
        working-directory: ${{ env.PROJECT_DIR }}
        run: cmake --preset Debug

      - name: Build wrapped with Sonar build-wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          build-wrapper-linux-x86-64 \
            --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} \
            cmake --build --preset Debug

      # Added v9, FIXED v12: clang-tidy against ONLY the fully-custom
      # file(s) this project owns (same CUSTOM_FILES scope as the
      # coverage-exclusions step above) - running it over the vendor MCSDK
      # tree would flood this with findings about code we're not supposed
      # to touch anyway (see codeRules/CodeDesignRules.md Rule 1, vendor
      # files immutable).
      #
      # v9 pointed -p at the ARM build-wrapper's output
      # (build-wrapper-output) and failed: "No compilation database found
      # ... or any parent directory" -> motor_telemetry_math.c is
      # host-only (see unit_tests/CMakeLists.txt's own header) and is
      # NEVER compiled as part of the ARM firmware build that build-wrapper
      # wraps, so it can never have an entry there regardless of path.
      # Fixed by pointing -p at unit_tests/build instead - the host build
      # a few steps above (added for coverage) actually compiles this
      # file, and now emits compile_commands.json too (added
      # CMAKE_EXPORT_COMPILE_COMMANDS ON to unit_tests/CMakeLists.txt).
      # This is also architecturally more correct, not just a workaround:
      # clang-tidy is clang-based and would likely misinterpret
      # arm-none-eabi-gcc-specific flags/builtins even if the file WERE in
      # that database.
      #
      # continue-on-error: this is a first run against real output for
      # both clang-tidy itself and the converter script - report-only
      # until proven reliable, same posture as the code-review job in
      # cnr_review_test_coverage.yml when its own new rules first shipped.
      #
      # Added explicit -checks= (run #30 succeeded but reported "Converted
      # 0 issue(s)" - with no .clang-tidy config or -checks flag in this
      # repo, that could mean the code is clean OR that clang-tidy's bare
      # default check set is too minimal to say anything meaningful either
      # way). Builds an explicit allowlist rather than trusting the
      # default: "-*" disables everything, then re-enables real bug-finding
      # categories (bugprone-, cert-, clang-analyzer-, misc-, performance-)
      # plus the one specific readability check this project actually
      # wants (const-correctness on pointer params). Deliberately excludes
      # broad readability-*/modernize-* - modernize-* is almost entirely
      # C++-oriented (irrelevant to this .c file) and broad readability-*
      # is subjective/stylistic and would conflict with the naming
      # conventions code_quality_checker.py already enforces for this repo.
      - name: Run clang-tidy (custom files only) and convert to Sonar format
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          clang-tidy -p unit_tests/build \
            -checks='-*,bugprone-*,cert-*,clang-analyzer-*,misc-*,performance-*,readability-non-const-parameter' \
            Src/motor_telemetry_math.c \
            > clang-tidy-output.txt 2>&1 || true
          cat clang-tidy-output.txt
          python3 codeRules/tools/convert_clang_tidy_to_sonar.py \
            < clang-tidy-output.txt > ${{ env.CLANG_TIDY_REPORT }}
          echo "------------------------------------------"
          echo "Generated ${{ env.CLANG_TIDY_REPORT }} (this is what gets passed to"
          echo "sonar.externalIssuesReportPaths in the SonarQube Scan step below):"
          echo "------------------------------------------"
          cat ${{ env.CLANG_TIDY_REPORT }}

      # Added 19-08-2026: this file was never persisted anywhere before -
      # it only existed transiently on the runner during this one job, then
      # vanished when the runner was torn down. Uploading both the raw
      # clang-tidy text output and the converted JSON so they can actually
      # be downloaded and inspected after a run, not just read from the log.
      - name: Upload clang-tidy report (raw + converted JSON)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-sonar-report
          path: |
            ${{ env.PROJECT_DIR }}/clang-tidy-output.txt
            ${{ env.PROJECT_DIR }}/${{ env.CLANG_TIDY_REPORT }}
          retention-days: 30

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ env.PROJECT_DIR }}
          # These paths resolve DIFFERENTLY, confirmed from real CI failure
          # logs across earlier versions of this file - do not "make them
          # consistent" without re-confirming against an actual run first:
          #
          # sonar.cfamily.compile-commands resolves relative to the
          # scanner's actual working directory (repo root), NOT relative to
          # projectBaseDir - needs the PROJECT_DIR prefix.
          #
          # sonar.coverageReportPaths (Generic Coverage Report sensor)
          # resolves relative to projectBaseDir itself, which is ALREADY
          # PROJECT_DIR - adding the PROJECT_DIR prefix here doubled it up
          # and failed to parse. Must be passed WITHOUT the prefix.
          #
          # sonar.externalIssuesReportPaths: CONFIRMED (v9, real CI run,
          # not guessed) to follow coverageReportPaths' convention, NOT
          # compile-commands' - resolves relative to projectBaseDir
          # (already PROJECT_DIR). The first attempt guessed the opposite
          # (PROJECT_DIR-prefixed) and failed with the exact same "doubled
          # path" shape as the v6 coverage bug:
          #   NoSuchFileException: .../CNR-Motor-Driver-1.0/
          #   CNR-Motor-Driver-1.0/clang-tidy-sonar.json
          # Must be passed WITHOUT the prefix, same as coverageReportPaths.
          #
          # sonar.coverage.exclusions uses the same **/<filename> glob style
          # as sonar.exclusions in sonar-project.properties, so it's
          # base-agnostic - computed in the "Compute coverage exclusions"
          # step above.
          args: >
            --define "sonar.cfamily.compile-commands=${{ env.PROJECT_DIR }}/${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json"
            --define "sonar.coverageReportPaths=${{ env.COVERAGE_REPORT }}"
            --define "sonar.coverage.exclusions=${{ steps.covexcl.outputs.exclusions }}"
            --define "sonar.externalIssuesReportPaths=${{ env.CLANG_TIDY_REPORT }}"

      # Optional: fail the pipeline if quality gate fails, once you're ready
      # to enforce it. Requires sonar.qualitygate.wait=true.
      # - name: SonarQube Quality Gate check
      #   uses: sonarsource/sonarqube-quality-gate-action@master
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
