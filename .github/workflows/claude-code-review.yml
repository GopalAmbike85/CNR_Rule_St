# ─────────────────────────────────────────────────────────────────────────────
# Claude Code PR Review
# Version: v1 (initial setup)
# Date: 01-08-2026
#
# Runs Anthropic's Claude Code Action on every pull request to post an
# AI-generated code review. This is separate from and complements
# code_qulity.yml (SonarCloud static analysis, build, unit tests, coverage) -
# this workflow reviews code quality/logic, that one enforces build and
# analyzer gates.
#
# Requires an ANTHROPIC_API_KEY secret to be added under this repo's
# Settings > Secrets and variables > Actions.
# ─────────────────────────────────────────────────────────────────────────────

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Visual progress comment while the review runs
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This is an STM32G431-based motor controller firmware project
            (embedded C, HAL/CMSIS, CMake). The main source lives under
            CNR-Motor-Driver-1.0/Src and CNR-Motor-Driver-1.0/Inc.

            Perform a focused code review of the changed files:

            1. **Correctness**
               - Logic errors, off-by-one errors, incorrect edge-case handling
               - Integer overflow/underflow, signed/unsigned mismatches
               - Uninitialized variables or use-after-free style bugs

            2. **Embedded-specific safety**
               - ISR safety: no blocking calls, no long-running work in interrupt
                 handlers, correct use of volatile for ISR-shared state
               - Register/peripheral access correctness (HAL/CMSIS usage)
               - Stack usage and any recursion or large stack allocations
               - Timing/real-time concerns for motor control loops

            3. **Memory and resource safety**
               - Buffer overruns, unchecked array indexing
               - Any dynamic allocation on a resource-constrained target

            4. **Maintainability**
               - Clear naming, adherence to existing code style in this repo
               - Missing or misleading comments on non-obvious logic

            5. **Testing**
               - Whether changes to CNR-Motor-Driver-1.0/Src warrant additions
                 to unit_tests/ (host-side Unity tests)

            Only comment on the diff, not the whole file. Use inline comments
            for specific issues and a short top-level summary comment.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
